<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de Gestión Integral para Centro Terapéutico Psyche" />
    <meta name="theme-color" content="#667eea" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Centro Terapéutico Psyche</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Verificación de autenticación
      console.log('🔍 Verificando autenticación...');
      const token = localStorage.getItem('token');
      const user = localStorage.getItem('user');
      console.log('Token disponible:', !!token);
      console.log('Usuario disponible:', !!user);
      
      if (!token && window.location.pathname !== '/login' && window.location.pathname !== '/registro') {
        console.log('❌ No hay token, redirigiendo a login...');
        window.location.href = '/login';
      } else if (token) {
        console.log('✅ Token encontrado, usuario autenticado');
      }
    </script>
  </body>
</html>
