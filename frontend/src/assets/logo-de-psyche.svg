<svg width="300" height="80" viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Perfil de cabeza con cerebro visible -->
  <g transform="translate(20, 10)">
    <!-- Contorno de la cabeza en perfil -->
    <path d="M10 15 Q15 5, 25 8 Q35 12, 38 25 Q35 40, 25 45 Q15 48, 10 35 Q8 25, 10 15 Z" 
          fill="none" 
          stroke="#000000" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Cerebro dentro de la cabeza -->
    <g transform="translate(12, 18)">
      <!-- Hemisferio izquierdo del cerebro -->
      <path d="M8 8 Q12 4, 16 6 Q20 8, 18 12 Q16 16, 12 14 Q8 12, 8 8 Z" 
            fill="none" 
            stroke="#000000" 
            stroke-width="1.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
      
      <!-- Hemisferio derecho del cerebro -->
      <path d="M16 6 Q20 4, 24 6 Q26 10, 24 14 Q20 16, 16 14 Q16 10, 16 6 Z" 
            fill="none" 
            stroke="#000000" 
            stroke-width="1.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
      
      <!-- Surcos y giros del cerebro -->
      <path d="M10 10 Q14 8, 18 10" 
            fill="none" 
            stroke="#000000" 
            stroke-width="1" 
            stroke-linecap="round"/>
      <path d="M10 14 Q14 12, 18 14" 
            fill="none" 
            stroke="#000000" 
            stroke-width="1" 
            stroke-linecap="round"/>
      <path d="M12 8 Q16 6, 20 8" 
            fill="none" 
            stroke="#000000" 
            stroke-width="1" 
            stroke-linecap="round"/>
      <path d="M12 12 Q16 10, 20 12" 
            fill="none" 
            stroke="#000000" 
            stroke-width="1" 
            stroke-linecap="round"/>
      
      <!-- Detalles adicionales del cerebro -->
      <path d="M14 6 Q18 4, 22 6" 
            fill="none" 
            stroke="#000000" 
            stroke-width="1" 
            stroke-linecap="round"/>
      <path d="M14 10 Q18 8, 22 10" 
            fill="none" 
            stroke="#000000" 
            stroke-width="1" 
            stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Texto "Dentro" -->
  <g transform="translate(70, 25)">
    <text x="0" y="20" 
          font-family="Times New Roman, serif" 
          font-size="24" 
          font-weight="normal" 
          fill="#000000">
      Dentro
    </text>
  </g>
  
  <!-- Texto "de Psyché" -->
  <g transform="translate(85, 45)">
    <text x="0" y="20" 
          font-family="Times New Roman, serif" 
          font-size="24" 
          font-weight="normal" 
          fill="#000000">
      de Psyché
    </text>
  </g>
</svg>